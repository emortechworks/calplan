; Deshabilitado por recomendación de seguridad.
; La "session upload progress" es una función legacy que escribe datos
; influídos por la petición en $_SESSION durante la subida de archivos,
; y es una de las vías de entrada confirmadas del CVE-2026-109619
; ("php2shell", RCE sin autenticación). Symfony no la utiliza.
session.upload_progress.enabled = Off
